name: Aventics Suite v1

on:
  push:
    paths:
      - "apps/desktop/**"
      - "service/suite-host/**"
      - "contracts/**"
      - "registry/**"
      - "skills/**"
      - "docs/**"
      - ".github/workflows/suite-v1.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "service/suite-host/**"
      - "contracts/**"
      - "registry/**"
      - "skills/**"
      - "docs/**"
      - ".github/workflows/suite-v1.yml"

jobs:
  build-and-package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install and test Suite Host
        working-directory: service/suite-host
        run: |
          npm install --no-audit --no-fund
          npm run check
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund
      - name: Build desktop
        working-directory: apps/desktop
        run: npm run build
      - name: Build Windows installer
        working-directory: apps/desktop
        run: npm run dist
      - name: Smoke-test packaged desktop and bundled Host
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $env:AVENTICS_SUITE_SMOKE_TEST = "1"
          $stdout = Join-Path $env:RUNNER_TEMP "aventics-suite-smoke-out.log"
          $stderr = Join-Path $env:RUNNER_TEMP "aventics-suite-smoke-err.log"
          $process = Start-Process -FilePath ".\release\win-unpacked\Aventics Suite.exe" -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $process.WaitForExit(30000)) {
            $process.Kill()
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue
            throw "Packaged Aventics Suite smoke test timed out after 30 seconds"
          }
          Get-Content $stdout -ErrorAction SilentlyContinue
          Get-Content $stderr -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) { throw "Packaged Aventics Suite smoke test failed with exit code $($process.ExitCode)" }
      - name: Upload Suite installer
        uses: actions/upload-artifact@v7
        with:
          name: Aventics-Suite-1.0.0-Windows
          path: |
            apps/desktop/release/Aventics-Suite-1.0.0-Setup.exe
            apps/desktop/release/latest.yml
          if-no-files-found: error
          retention-days: 30
