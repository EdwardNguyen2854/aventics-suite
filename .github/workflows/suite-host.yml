name: Suite Host

on:
  push:
    paths:
      - "service/suite-host/**"
      - "contracts/**"
      - "registry/**"
      - "skills/**"
      - ".github/workflows/suite-host.yml"
  pull_request:
    paths:
      - "service/suite-host/**"
      - "contracts/**"
      - "registry/**"
      - "skills/**"
      - ".github/workflows/suite-host.yml"

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: service/suite-host
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - run: npm run check
